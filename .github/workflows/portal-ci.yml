name: Najm Hotspot Static Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portal-tests:
    name: Validate Hotspot templates and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/portal.core.js
          node --check js/chap.md5.js
          node --check js/cam.najm.js
      - name: Run regressions
        run: node --test tests/*.test.cjs
      - name: Package tested MikroTik Hotspot files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          cp index.html alogin.html error.html flogin.html flogout.html fstatus.html login.html logout.html redirect.html status.html dist/stage/
          cp -R css font img js dist/stage/
          (cd dist/stage && zip -q -r "../Najimspeed-Hotspot-${GITHUB_SHA:0:12}.zip" .)
          rm -rf dist/stage
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - name: Upload validated Hotspot package
        uses: actions/upload-artifact@v4
        with:
          name: Najimspeed-Hotspot-tested
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
